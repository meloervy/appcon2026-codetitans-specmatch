[package]
name = "meloervy/specmatch"
version = "1.0.0"
description = "SpecMatch - Enterprise IT Asset Management & Intelligent Hardware Recommendation Engine"
license = "MIT"
readme = "README.md"

[dependencies]
"php/php" = "^8.3"

[fs]
"/app" = "."

[[command]]
name = "serve"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
env = [
    "APP_ENV=production",
    "APP_DEBUG=false",
    "DB_CONNECTION=sqlite",
    "DB_DATABASE=/app/database/database.sqlite",
    "SESSION_DRIVER=file",
    "CACHE_STORE=file",
    "QUEUE_CONNECTION=sync",
    "GEMINI_MODEL=gemini-3.1-flash-lite",
    "PORT=8080"
]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]
